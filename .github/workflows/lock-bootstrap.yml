name: Dependency lock bootstrap
on:
  push:
    branches: [work/release-hardening]
permissions:
  contents: read
jobs:
  generate-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Resolve pinned dependency graphs
        run: |
          python -m pip install 'uv==0.13.4'
          uv pip compile --quiet --python-version 3.13 --output-file backend/requirements.lock backend/requirements.txt
          uv pip compile --quiet --python-version 3.13 --output-file backend/requirements-dev.lock backend/requirements-dev.txt
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Transfer deterministic lock snapshots for reviewed commit
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          for name, path in [('npm','frontend/package-lock.json'),('python','backend/requirements.lock'),('python_dev','backend/requirements-dev.lock')]:
              payload=base64.b64encode(gzip.compress(Path(path).read_bytes(), mtime=0)).decode()
              for i in range(0,len(payload),3500):
                  print('LOCKPART_%s_%03d=%s' % (name,i//3500,payload[i:i+3500]))
              print('LOCKEND_%s_%d' % (name, len(Path(path).read_bytes())))
          PY
