name: CI
on:
  push:
    branches: [main, "work/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triagedock
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: triagedock
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triagedock -d triagedock"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
      INGEST_API_KEY: ci-only-ingest-key
      POSTGRES_DB: triagedock
      POSTGRES_USER: triagedock
      POSTGRES_PASSWORD: ci-password
      POSTGRES_HOST: localhost
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_public_copy.py
      - run: python -m pip install -r backend/requirements-dev.lock
      - working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test incidents --verbosity 2
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t triagedock:ci .
      - name: Boot Compose and verify real HTTP / PostgreSQL integration
        env:
          DJANGO_SECRET_KEY: ci-ephemeral-smoke-secret
          INGEST_API_KEY: ci-ephemeral-smoke-intake
          POSTGRES_PASSWORD: ci-ephemeral-smoke-postgres
        run: bash .github/scripts/smoke.sh
      - name: Print Compose logs if smoke fails
        if: failure()
        env:
          DJANGO_SECRET_KEY: ci-ephemeral-smoke-secret
          INGEST_API_KEY: ci-ephemeral-smoke-intake
          POSTGRES_PASSWORD: ci-ephemeral-smoke-postgres
        run: docker compose logs --tail=100
      - name: Stop Compose services
        if: always()
        env:
          DJANGO_SECRET_KEY: ci-ephemeral-smoke-secret
          INGEST_API_KEY: ci-ephemeral-smoke-intake
          POSTGRES_PASSWORD: ci-ephemeral-smoke-postgres
        run: docker compose down
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit locked frontend production dependencies
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Audit locked backend dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.lock
