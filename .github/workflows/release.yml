# The original first release is published and immutable.
# New releases require exact-candidate manual verification before publication.
name: Release acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "This workflow does not publish tags or releases."
          echo "Record and review local/backend/frontend/Docker/browser evidence for the exact commit."
          echo "Follow docs/RELEASE.md before publishing a new version."
