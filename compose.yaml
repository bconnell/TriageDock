name: triagedock

x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  INGEST_API_KEY: ${INGEST_API_KEY:-}
  INGEST_SHARED_KEY_ENABLED: ${INGEST_SHARED_KEY_ENABLED:-1}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
  POSTGRES_DB: ${POSTGRES_DB:-triagedock}
  POSTGRES_USER: ${POSTGRES_USER:-triagedock}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_HOST: db
  NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
  CELERY_BROKER_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1

x-app-base: &app-base
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: *app-environment

services:
  db:
    image: postgres:16-alpine
    mem_limit: 512m
    command: ["postgres", "-c", "max_connections=30"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-triagedock}
      POSTGRES_USER: ${POSTGRES_USER:-triagedock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    <<: *app-base
    mem_limit: 384m
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app-base
    mem_limit: 384m
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app-base
    mem_limit: 512m
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    <<: *app-base
    mem_limit: 192m
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/triagedock-celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
